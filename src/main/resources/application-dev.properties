# Development environment
spring.mongodb.uri=${MONGODB_URI_DEV}
spring.mongodb.database=${MONGODB_DATABASE_DEV:dev}
# PORT is injected by Railway / Render at runtime; defaults to 8080 locally
server.port=${PORT:8080}

# Google Cloud Storage — commented out (migrated to Railway/Render)
# gcp.storage.bucket-name=${GCS_BUCKET_NAME:}
