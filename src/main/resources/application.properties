spring.application.name=be-ncop
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Common configuration
spring.data.mongodb.auto-index-creation=true

# API Key Security
ncop.security.api-key=${NCOP_API_KEY:ncop-dev-api-key-2026}

# Google Cloud Storage — commented out (migrated to Railway/Render; local disk is used)
# Re-enable these (and restore google-cloud-storage in pom.xml) when a cloud
# storage provider is configured for the new deployment target.
# gcp.storage.bucket-name=${GCS_BUCKET_NAME:}
# gcp.storage.project-id=${GCS_PROJECT_ID:}
# gcp.storage.credentials-path=${GCS_CREDENTIALS_PATH:}

# Multipart File Size Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
